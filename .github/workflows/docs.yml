name: docs

on:
  schedule:
    - cron: "50 8 * * 3,4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: refresh
        run: |
          set -eu
          sleep $(( RANDOM % 900 ))
          f="README.md"
          [ -f "$f" ] || exit 0
          stamp="<!-- checked: $(date -u +%Y-%m-%d) -->"
          if grep -q "^<!-- checked: " "$f"; then
            sed -i "s|^<!-- checked: .*|$stamp|" "$f"
          else
            printf '\n%s\n' "$stamp" >> "$f"
          fi

      - name: commit
        run: |
          set -eu
          git config user.name "GravityStaff"
          git config user.email "306958301+GravityStaff@users.noreply.github.com"
          set -- "chore: refresh metadata" "docs: bump date" "docs: touch up" "chore: nightly tidy" "docs: keep current"
          n=$(( ${GITHUB_RUN_NUMBER:-0} % $# + 1 ))
          eval msg=\${$n}
          git add -- "README.md"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$msg"
          git push
